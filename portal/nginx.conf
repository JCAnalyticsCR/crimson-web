# El panel no se indexa nunca; la tienda en dominio propio (tienda.*, CNAME al portal) si. Valor vacio = sin cabecera.
map $host $robots_tag {
  default     "noindex, nofollow";
  ~^tienda\.  "";
}

# La direccion de Railway del panel (portal-...up.railway.app) lleva al dominio propio. Ahi la sesion no puede
# renovarse (el API solo canjea la cookie desde PUBLIC_BASE_URL, auth._portal_only): cada recarga sacaba a la persona al
# login (26/10, "con Ctrl+Shift+R me saca del perfil"). La tienda usa su propio dominio y no entra aqui.
map $host $railway_host {
  default                                   0;
  "~^portal-[a-z0-9-]+\.up\.railway\.app$"  1;
}

# Tienda en dominio propio: SEO servido por el API (metas por ruta via SSI, robots, sitemap, 301 de Fygaro, 404 real).
map $host $is_store {
  default     "";
  ~^tienda\.  "1";
}
# ruta pedida SIN la query (tras try_files, $uri ya es /index.html; $request_uri no cambia). Unica excepcion (O2-01c):
# ?pagina=N de un listado, que tiene su propia canonica; cualquier otro parametro se descarta y no cambia las metas.
# (la primera expresion que calza gana: la de la pagina va antes)
map $request_uri $seo_path {
  default                                                   "/";
  "~^(?<sp>/[^?]*)\?(?:[^#]*&)?pagina=(?<pg>[0-9]{1,3})(?:[&#]|$)"  "$sp?pagina=$pg";
  "~^(?<sp>/[^?]*)"                                         $sp;
}
# Arranque rapido y cuerpo de la tienda (O2-01a y O2-01b, locations /__boot/ y /__body/): el fragmento se guarda 60 s por
# dominio y ruta (o lo que diga el Cache-Control del API, que manda max-age=60). Si el API no responde, el ultimo guardado.
proxy_cache_path /var/cache/nginx/sh_boot levels=1:2 keys_zone=sh_boot:2m max_size=32m inactive=10m use_temp_path=off;
# Tienda en dominio propio: del API solo pasa lo publico (vitrina, checkout, pago, archivos publicos). El resto (login,
# ajustes, /docs, webhooks) vive solo en el panel: en tienda.* da 404.
map "$is_store:$uri" $store_api_blocked {
  default 0;
  "~^1:/api/(?!public/|media/f/)" 1;
}
# Respuestas del API (O0-05a): el JSON de la tienda nunca se indexa, aunque robots.txt abra /api/public/ (O1-01) para
# que Google pueda pintar la vitrina. Las fotos (/api/media/f/) quedan sin cabecera en la tienda: las fichas las citan
# en el JSON-LD y Google tiene que poder indexarlas. En el panel todo sigue con "noindex, nofollow".
# (la primera expresion que calza gana: media antes que el resto de /api/)
map "$is_store:$uri" $api_robots_tag {
  default               "noindex, nofollow";
  "~^1:/api/media/f/"   "";
  "~^1:"                "noindex";
}
# Barra final (O1-12): en la tienda, /catalogo/ y /c/<x>/ eran una segunda direccion de la misma pagina. 301 en un solo
# salto a la direccion sin barra, SOLO para rutas conocidas y slugs simples (letras, numeros y guiones: nada que
# decodificado pueda ensuciar la cabecera Location). Las de Fygaro (/products/<uuid>/) no pasan por aqui: las atiende
# su propia location (un solo salto a la ficha nueva). Vacio = no redirige.
map "$is_store:$uri" $store_slash {
  default "";
  "~^1:(?<sin_barra>/(?:catalogo|asesoria|comparar|arma-tu-sistema|(?:c|p|info)/[a-z0-9-]+))/$" $sin_barra;
}
# rutas que la vitrina no conoce -> 404 real (con la vitrina y noindex). Raiz, rutas de la tienda y archivos quedan fuera.
map "$is_store:$uri" $store_unknown {
  default 0;
  "~^1:/(?!(catalogo|buscar|arma-tu-sistema|comparar|asesoria|index\.html|icon\.png|logo\.png|logo-icon\.png|favicon\.ico|robots\.txt|sitemap\.xml)$)(?!(c|p|info|pg|assets|fonts|products|page|terms|policies)(/|$)).+" 1;
}

server {
  listen ${PORT};

  if ($railway_host) { return 301 https://panel.crimsoncr.com$request_uri; }
  if ($store_slash) { return 301 https://$host$store_slash$is_args$args; }
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy no-referrer;
  add_header X-Robots-Tag $robots_tag always;
  add_header Strict-Transport-Security "max-age=31536000" always;  # un ano (plan 1.10); cada location con add_header lo repite
  server_tokens off;

  # IP real del cliente (plan 1.10). El edge de Railway llega desde su red interna (100.64.0.0/10) y agrega la IP del
  # cliente a X-Forwarded-For. Con realip, $remote_addr pasa a ser la ULTIMA direccion que no es de una red interna:
  # lo que el cliente escriba a la izquierda en X-Forwarded-For no cuenta. Esa IP viaja al API firmada con
  # PROXY_SHARED_KEY (api/app/core/clientip.py), asi el API la cree sin creer en cabeceras que escribe cualquiera.
  # El plan decia "la primera IP de X-Forwarded-For": si el edge AGREGA (no reemplaza) la cabecera, la primera la
  # escribe el cliente y los limites por IP se saltarian; la ultima no interna no se falsifica. Supuesto: el edge
  # conecta desde estas redes. Paso obligatorio al desplegar (api/README.md): /api/auth/ip-check por el panel tiene que
  # dar TU IP publica; si da otra (la del edge), agregar aqui el rango del edge.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 100.64.0.0/10;
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # TLS hacia el API (API_UPSTREAM = su URL publica HTTPS): se verifica el certificado y el nombre. Sin esto, quien
  # intercepte ese tramo se lleva PROXY_SHARED_KEY y firma la IP que quiera. Con http:// (docker-compose) no aplica.
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 3;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

  # el HTML ya va comprimido por defecto; el JSON de /api/ lo comprime (o no) el API, nunca nginx
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    if ($store_api_blocked) { return 404; }
    # API_UPSTREAM = URL publica HTTPS del servicio api (o http://api:8000 en docker-compose)
    proxy_pass ${API_UPSTREAM}/;
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # IP real firmada. Sin llave nginx no manda la cabecera vacia y el API ve "sin_llave": la IP de la conexion, que
    # es la de este nginx para todos (limites por IP globales). La llave: hex (openssl rand -hex 32), la misma en las
    # variables de portal y api.
    proxy_set_header X-Crimson-Client-IP $remote_addr;
    proxy_set_header X-Crimson-Proxy-Key "${PROXY_SHARED_KEY}";
    client_max_body_size 64m;  # igual que BodyLimitMiddleware del API (importacion del historico de Fygaro)
    # noindex del JSON (ver el map $api_robots_tag). Un add_header aqui anula los del server: se repiten los de
    # seguridad tal como estaban (los tres primeros sin always, como en el server).
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;
    add_header X-Robots-Tag $api_robots_tag always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # ---------- tienda en dominio propio: lo que los buscadores y WhatsApp leen sin JavaScript ----------
  # Fragmento <head> por ruta (titulo, descripcion, canonica, Open Graph, JSON-LD). Lo incrusta index.html por SSI.
  location /__seo/ {
    internal;
    proxy_pass ${API_UPSTREAM}/public/seo/head/;
    proxy_set_header Accept-Encoding "";  # SIN esto el edge devuelve gzip y el SSI lo pegaba crudo en el <head>
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Store-Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }
  # Datos de arranque de la vitrina (O2-01a): <script type="application/json" id="sh-boot"> con el slug, la tienda y, en
  # la portada, la portada. Lo incrusta index.html por SSI, solo en el dominio de la tienda. Guardado 60 s.
  location /__boot/ {
    internal;
    proxy_pass ${API_UPSTREAM}/public/seo/boot/;
    proxy_set_header Accept-Encoding "";  # igual que /__seo/: el SSI pega el cuerpo tal cual
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Store-Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_cache sh_boot;
    proxy_cache_key "$host$uri$is_args$args";
    proxy_cache_valid 200 60s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 3s;
    # API caido o lento sin copia guardada: cuerpo vacio (sin esto el SSI pegaba la pagina de error 502/504 de nginx)
    proxy_intercept_errors on;
    error_page 400 404 500 502 503 504 =204 @sh_vacio;
  }
  # Contenido real de la ruta (O2-01b, apagado por defecto en el API: settings.store.ssr_body). index.html lo guarda en
  # una variable (include set=) y solo si trae algo enlaza la hoja de la tienda y lo pinta. 3 s como maximo; si falla,
  # vacio y la pagina sigue como hoy. Guardado 60 s, como el arranque.
  location /__body/ {
    internal;
    proxy_pass ${API_UPSTREAM}/public/seo/body/;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Store-Host $host;
    proxy_connect_timeout 1s;
    proxy_send_timeout 2s;
    proxy_read_timeout 2s;
    subrequest_output_buffer_size 256k;  # include set= guarda la respuesta entera en la variable
    proxy_cache sh_boot;
    proxy_cache_key "$host$uri$is_args$args";
    proxy_cache_valid 200 60s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 2s;
    proxy_intercept_errors on;
    error_page 400 404 500 502 503 504 =204 @sh_vacio;
  }
  location @sh_vacio { return 204; }
  # Existe la ficha o la categoria? 204 si, 403 no (-> 404 real abajo). auth_request no admite variables en la uri:
  # la ruta viaja en X-Original-URI.
  location = /__exists {
    internal;
    proxy_pass ${API_UPSTREAM}/public/seo/exists;
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Store-Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }
  # Sin JavaScript (O1-06): nombre del comercio y contacto real (WhatsApp, telefono). Lo incrusta index.html por SSI
  # dentro de <noscript>, solo en el dominio de la tienda.
  location = /__noscript {
    internal;
    proxy_pass ${API_UPSTREAM}/public/seo/noscript;
    proxy_set_header Accept-Encoding "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Store-Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }
  location = /robots.txt {
    proxy_pass ${API_UPSTREAM}/public/seo/robots.txt;
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Store-Host $host;
  }
  location = /sitemap.xml {
    proxy_pass ${API_UPSTREAM}/public/seo/sitemap.xml;
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Store-Host $host;
  }
  # Direcciones de Fygaro -> 301 a las nuevas (el panel no usa estas rutas; en otro dominio el API manda a /)
  location ~ ^/(products|page|terms|policies)(/|$) {
    rewrite ^ /public/seo/legacy break;
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Store-Host $host;
    proxy_set_header X-Original-URI $request_uri;
  }
  # Ficha y categoria: si no existen, 404 real con la vitrina (y noindex). Si el API no responde, se sirve igual.
  # O3-07a: una categoria renombrada responde 401 con su direccion vigente (X-Store-Redirect) -> 301 a esa direccion.
  location ~ ^/(p|c)/ {
    auth_request /__exists;
    auth_request_set $tienda_movida $upstream_http_x_store_redirect;
    error_page 401 = @tienda_movida;
    error_page 403 =404 /index.html;
    error_page 500 502 503 504 =200 /index.html;
    try_files $uri /index.html;
  }
  location @tienda_movida {
    # solo una direccion de categoria propia; cualquier otra cosa es un 404 (nunca un salto a otro sitio)
    if ($tienda_movida !~ "^/c/[a-z0-9-]+$") { return 404; }
    add_header Cache-Control "public, max-age=3600" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://$host$tienda_movida$is_args$args;
  }

  location /fonts/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff; add_header Strict-Transport-Security "max-age=31536000" always; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff; add_header Strict-Transport-Security "max-age=31536000" always; }
  # index.html nunca se guarda sin revisar: sin esto el navegador decidia por su cuenta y Andres seguia viendo
  # la version vieja horas despues de publicar. Los /assets/ llevan hash en el nombre y si se guardan un ano.
  # (un add_header dentro de location anula los del server: por eso se repiten los de seguridad)
  # ssi: index.html pide sus metas al API solo en el dominio de la tienda (ver el comentario en index.html).
  location / {
    ssi on;
    ssi_silent_errors on;
    error_page 404 @tienda404;
    if ($store_unknown) { return 404; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;
    add_header X-Robots-Tag $robots_tag always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri /index.html;
  }

  # Ruta que la vitrina no conoce: la vitrina misma (con SSI) pero con estado 404 y sin indexar
  location @tienda404 {
    ssi on;
    ssi_silent_errors on;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    rewrite ^ /index.html break;
  }
}
