# El panel no se indexa nunca; la tienda en dominio propio (tienda.*, CNAME al portal) si. Valor vacio = sin cabecera.
map $host $robots_tag {
  default     "noindex, nofollow";
  ~^tienda\.  "";
}

# Tienda en dominio propio: SEO servido por el API (metas por ruta via SSI, robots, sitemap, 301 de Fygaro, 404 real).
map $host $is_store {
  default     "";
  ~^tienda\.  "1";
}
# ruta pedida SIN la query (tras try_files, $uri ya es /index.html; $request_uri no cambia)
map $request_uri $seo_path {
  default             "/";
  "~^(?<sp>/[^?]*)"   $sp;
}
# rutas que la vitrina no conoce -> 404 real (con la vitrina y noindex). Raiz, rutas de la tienda y archivos quedan fuera.
map "$is_store:$uri" $store_unknown {
  default 0;
  "~^1:/(?!(catalogo|buscar|arma-tu-sistema|comparar|asesoria|index\.html|icon\.png|logo\.png|logo-icon\.png|favicon\.ico|robots\.txt|sitemap\.xml)$)(?!(c|p|info|pg|assets|fonts|products|page|terms|policies)(/|$)).+" 1;
}

server {
  listen ${PORT};
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy no-referrer;
  add_header X-Robots-Tag $robots_tag always;
  add_header Strict-Transport-Security "max-age=86400" always;  # se sube a un ano cuando todo este estable
  server_tokens off;

  # el HTML ya va comprimido por defecto; el JSON de /api/ lo comprime (o no) el API, nunca nginx
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    # API_UPSTREAM = URL publica HTTPS del servicio api (o http://api:8000 en docker-compose)
    proxy_pass ${API_UPSTREAM}/;
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 64m;  # igual que BodyLimitMiddleware del API (importacion del historico de Fygaro)
  }

  # ---------- tienda en dominio propio: lo que los buscadores y WhatsApp leen sin JavaScript ----------
  # Fragmento <head> por ruta (titulo, descripcion, canonica, Open Graph, JSON-LD). Lo incrusta index.html por SSI.
  location /__seo/ {
    internal;
    proxy_pass ${API_UPSTREAM}/public/seo/head/;
    proxy_set_header Accept-Encoding "";  # SIN esto el edge devuelve gzip y el SSI lo pegaba crudo en el <head>
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Store-Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }
  # Existe la ficha o la categoria? 204 si, 403 no (-> 404 real abajo). auth_request no admite variables en la uri:
  # la ruta viaja en X-Original-URI.
  location = /__exists {
    internal;
    proxy_pass ${API_UPSTREAM}/public/seo/exists;
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Store-Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }
  location = /robots.txt {
    proxy_pass ${API_UPSTREAM}/public/seo/robots.txt;
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Store-Host $host;
  }
  location = /sitemap.xml {
    proxy_pass ${API_UPSTREAM}/public/seo/sitemap.xml;
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Store-Host $host;
  }
  # Direcciones de Fygaro -> 301 a las nuevas (el panel no usa estas rutas; en otro dominio el API manda a /)
  location ~ ^/(products|page|terms|policies)(/|$) {
    rewrite ^ /public/seo/legacy break;
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Store-Host $host;
    proxy_set_header X-Original-URI $request_uri;
  }
  # Ficha y categoria: si no existen, 404 real con la vitrina (y noindex). Si el API no responde, se sirve igual.
  location ~ ^/(p|c)/ {
    auth_request /__exists;
    error_page 403 =404 /index.html;
    error_page 500 502 503 504 =200 /index.html;
    try_files $uri /index.html;
  }

  location /fonts/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff; add_header Strict-Transport-Security "max-age=86400" always; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff; add_header Strict-Transport-Security "max-age=86400" always; }
  # index.html nunca se guarda sin revisar: sin esto el navegador decidia por su cuenta y Andres seguia viendo
  # la version vieja horas despues de publicar. Los /assets/ llevan hash en el nombre y si se guardan un ano.
  # (un add_header dentro de location anula los del server: por eso se repiten los de seguridad)
  # ssi: index.html pide sus metas al API solo en el dominio de la tienda (ver el comentario en index.html).
  location / {
    ssi on;
    ssi_silent_errors on;
    error_page 404 @tienda404;
    if ($store_unknown) { return 404; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;
    add_header X-Robots-Tag $robots_tag always;
    add_header Strict-Transport-Security "max-age=86400" always;
    try_files $uri /index.html;
  }

  # Ruta que la vitrina no conoce: la vitrina misma (con SSI) pero con estado 404 y sin indexar
  location @tienda404 {
    ssi on;
    ssi_silent_errors on;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    rewrite ^ /index.html break;
  }
}
