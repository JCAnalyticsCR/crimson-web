server {
  listen ${PORT};
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy no-referrer;
  server_tokens off;

  location /api/ {
    # API_UPSTREAM = URL publica HTTPS del servicio api (o http://api:8000 en docker-compose)
    proxy_pass ${API_UPSTREAM}/;
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 10m;
  }

  location /fonts/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff; }
  # index.html nunca se guarda sin revisar: sin esto el navegador decidia por su cuenta y Andres seguia viendo
  # la version vieja horas despues de publicar. Los /assets/ llevan hash en el nombre y si se guardan un ano.
  # (un add_header dentro de location anula los del server: por eso se repiten los de seguridad)
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;
    try_files $uri /index.html;
  }
}
