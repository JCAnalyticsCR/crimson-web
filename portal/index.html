<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15131a" />
    <!-- robots: lo decide el host (cabecera X-Robots-Tag en nginx.conf y meta que pone main.tsx). La tienda en
         dominio propio se indexa; el panel no. -->
    <link rel="icon" href="/icon.png" />
    <!-- Imágenes de productos: eurocompcr.com es el origen de las URLs del catálogo -->
    <link rel="preconnect" href="https://eurocompcr.com" />
    <!-- SEO de la tienda (tienda.*): nginx resuelve estas directivas SSI y trae del API el titulo, la descripcion,
         la canonica, Open Graph y el JSON-LD de la ruta pedida (/public/seo/head). Sin nginx (vite dev) o en el
         panel son comentarios y queda el titulo de abajo. Si el API no responde, queda el stub. -->
    <!--# block name="seo_stub" --><meta name="x-seo" content="sin-datos" /><!--# endblock -->
    <!--# if expr="$is_store" --><!--# include virtual="/__seo$seo_path" stub="seo_stub" --><!--# else -->
    <title>Crimson · Panel</title>
    <!--# endif -->
  </head>
  <body>
    <!-- Contenido real en el HTML (O2-01b, apagado por defecto: Mi Tienda -> settings.store.ssr_body por tipo de ruta).
         En el dominio de la tienda nginx pide /public/seo/body (3 s como maximo) y, si trae algo: la hoja de la tienda
         (el plugin de vite.tienda.ts pone aqui su enlace con hash), el contenido en #sh-ssr y React montando oculto
         detras, hasta que la vitrina este lista y lo reemplaza (ssrBody.ts). Vacio o con el API caido: como hoy.
         Sin nginx (vite dev, e2e:compra) este bloque queda como esta: #sh-ssr solo tiene un comentario (:empty) y la
         regla no oculta nada; el panel y la tienda cargan igual. -->
    <!--# set var="sh_body" value="" -->
    <!--# if expr="$is_store" --><!--# include virtual="/__body$seo_path" set="sh_body" wait="yes" --><!--# endif -->
    <!--# if expr="$sh_body" --><!--sh-store-css--><style>#sh-ssr:not(:empty)~#root{position:absolute;top:0;left:0;right:0;visibility:hidden}</style><div id="sh-ssr"><!--# echo var="sh_body" encoding="none" --></div><!--# endif -->
    <div id="root"></div>
    <!-- Sin JavaScript (O1-06): en el dominio de la tienda, el nombre del comercio y su WhatsApp y telefono reales
         (/public/seo/noscript). En el panel, o sin nginx, no hay nada. -->
    <!--# if expr="$is_store" --><noscript><!--# include virtual="/__noscript" --></noscript><!--# endif -->
    <!-- Arranque rapido (O2-01a): en el dominio de la tienda, nginx incrusta <script type="application/json" id="sh-boot">
         con el slug, los datos base de la tienda y, en la portada, la portada (/public/seo/boot). La vitrina pinta con
         eso sin esperar /store-domain ni /store, y revalida en segundo plano. Si el API no responde, no hay nada y la
         vitrina sigue como antes. -->
    <!--# if expr="$is_store" --><!--# include virtual="/__boot$seo_path" --><!--# endif -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
